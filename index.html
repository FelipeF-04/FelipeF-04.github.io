<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymMe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GymMe</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #414141;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      const workers = new Map();

      function postResult(message, transfer) {
        window.postMessage(message, '*', transfer || []);
      }

      function terminateWorker(requestId) {
        const worker = workers.get(requestId);
        if (!worker) return;
        workers.delete(requestId);
        worker.terminate();
      }

      window.trimVideoWithFfmpegCallback = function (
        requestId,
        inputBase64,
        startMs,
        endMs,
        rotationDegrees
      ) {
        let worker;
        try {
          worker = new Worker(
            new URL('video_trim_worker.js', document.baseURI)
          );
          workers.set(requestId, worker);

          worker.onmessage = function (event) {
            const result = event.data || {};
            if (result.requestId !== requestId) return;
            terminateWorker(requestId);

            if (!result.ok) {
              const details = result.error || {};
              const name = details.name ? `${details.name}: ` : '';
              const message = details.message || 'Unknown Worker error.';
              postResult({
                type: 'ffmpeg-trim-result',
                requestId,
                ok: false,
                error: `FFmpeg trim failed during ${result.stage || 'worker'}: ${name}${message}`,
                errorDetails: {
                  ...details,
                  stage: result.stage || 'worker',
                },
              });
              return;
            }

            const outputBuffer = result.outputBuffer;
            if (!(outputBuffer instanceof ArrayBuffer)) {
              postResult({
                type: 'ffmpeg-trim-result',
                requestId,
                ok: false,
                error: 'FFmpeg trim failed during output-read: Worker returned no output bytes.',
                errorDetails: {
                  stage: 'output-read',
                  name: 'InvalidWorkerResult',
                  message: 'Worker returned no output ArrayBuffer.',
                },
              });
              return;
            }

            const objectUrl = URL.createObjectURL(
              new Blob([outputBuffer], { type: 'video/mp4' })
            );
            postResult(
              {
                type: 'ffmpeg-trim-result',
                requestId,
                ok: true,
                bytes: outputBuffer,
                objectUrl,
              },
              [outputBuffer]
            );
          };

          worker.onerror = function (event) {
            terminateWorker(requestId);
            postResult({
              type: 'ffmpeg-trim-result',
              requestId,
              ok: false,
              error: `FFmpeg Worker communication failed: ${event.message || 'Worker script error.'}`,
              errorDetails: {
                stage: 'worker-communication',
                name: 'WorkerError',
                message: event.message || 'Worker script error.',
                filename: event.filename || '',
                line: event.lineno || 0,
                column: event.colno || 0,
              },
            });
          };

          worker.onmessageerror = function () {
            terminateWorker(requestId);
            postResult({
              type: 'ffmpeg-trim-result',
              requestId,
              ok: false,
              error: 'FFmpeg Worker communication failed while receiving its result.',
              errorDetails: {
                stage: 'worker-communication',
                name: 'MessageError',
                message: 'The Worker result could not be deserialized.',
              },
            });
          };

          worker.postMessage({
            requestId,
            inputBase64,
            startMs,
            endMs,
            rotationDegrees,
          });
        } catch (err) {
          terminateWorker(requestId);
          const message = err && err.message ? err.message : String(err);
          postResult({
            type: 'ffmpeg-trim-result',
            requestId,
            ok: false,
            error: `FFmpeg Worker communication failed: ${message}`,
            errorDetails: {
              stage: 'worker-communication',
              name: err && err.name ? err.name : 'WorkerError',
              message,
            },
          });
        }
      };

      window.cancelVideoTrimWithFfmpegWorker = terminateWorker;
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
